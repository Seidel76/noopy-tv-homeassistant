refresh:
  name: Refresh
  description: Force a data refresh from OneTV.

play_channel:
  name: Change channel
  description: Change the channel playing in OneTV.
  fields:
    channel_id:
      name: Channel ID
      description: Channel UUID, stream id or name. Names are matched ignoring case and accents.
      required: true
      example: "TF1"
      selector:
        text:

play_movie:
  name: Play a movie
  description: Play a movie from the OneTV catalog.
  fields:
    movie_id:
      name: Movie ID
      description: Movie identifier (shown in the media browser of the OneTV entity).
      required: true
      example: "12345"
      selector:
        text:
    resume_position:
      name: Resume at
      description: Resume position in seconds. Leave empty to start from the beginning.
      required: false
      example: 1830
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box

play_episode:
  name: Play an episode
  description: Play a TV show episode from the OneTV catalog.
  fields:
    series_id:
      name: Series ID
      description: Series identifier (shown in the media browser of the OneTV entity).
      required: true
      example: "6789"
      selector:
        text:
    season:
      name: Season
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 100
          mode: box
    episode:
      name: Episode
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    resume_position:
      name: Resume at
      description: Resume position in seconds. Leave empty to start from the beginning.
      required: false
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box

send_command:
  name: Send a command
  description: >-
    Send a raw command to the OneTV player. Volume commands change the player's own level,
    not the TV volume (out of reach for a tvOS app).
  fields:
    command:
      name: Command
      required: true
      example: seekToLive
      selector:
        select:
          options:
            - play
            - pause
            - togglePlayPause
            - stop
            - seekRelative
            - seekAbsolute
            - seekToLive
            - setAudioTrack
            - setSubtitleTrack
            - nextChannel
            - previousChannel
            - setVolume
            - adjustVolume
            - toggleMute
    params:
      name: Parameters
      description: >-
        Command parameters. seekRelative takes "seconds", seekAbsolute takes "position",
        setAudioTrack and setSubtitleTrack take "trackIndex", setVolume takes "level"
        (0 to 1), adjustVolume takes "delta" (signed). toggleMute takes none.
      required: false
      example: '{"seconds": -30}'
      selector:
        object:
